name: ecom-ai-platform

services:
  ecom-ai:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-3200}:3000"
    env_file: .env
    environment:
      PORT: "3000"
      NODE_ENV: production
      TZ: Asia/Shanghai
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET in .env}
      RPA_CALLBACK_TOKEN: ${RPA_CALLBACK_TOKEN:?Set a random RPA_CALLBACK_TOKEN in .env}
      ALLOW_REGISTRATION: "false"
      SEED_DEFAULT_USERS: "false"
      SEED_DEMO_DATA: "false"
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-false}
      RPA_MOCK_MODE: "true"
      REDIS_URL: redis://redis:6379
      REDIS_REQUIRED: ${REDIS_REQUIRED:-true}
      DB_DRIVER: ${DB_DRIVER:-postgres}
      DATABASE_URL: postgres://${PG_USER:-ecom}:${PG_PASSWORD:-ecom_dev_password}@postgres:5432/${PG_DB:-ecom_ai}
      QUEUE_ENABLED: ${QUEUE_ENABLED:-false}
      # 多 Provider 优先级+故障转移（JSON）；留空回退单源 AI_* 配置
      AI_PROVIDERS: ${AI_PROVIDERS:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-ecom-uploads}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      DATA_DIR: /app/data
      DB_PATH: /app/data/ecom-ai.db
      UPLOAD_DIR: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-ecom}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-ecom_dev_password}
      POSTGRES_DB: ${PG_DB:-ecom_ai}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-55434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-ecom} -d ${PG_DB:-ecom_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9010}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  redisdata:
  miniodata:

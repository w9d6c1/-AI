name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject backend API base URL
        shell: bash
        run: |
          base="${{ secrets.BACKEND_API_URL }}"
          base="${base%/}"
          cat > public/js/config.js <<'EOF'
          window.__API_BASE__ = "__API_BASE_PLACEHOLDER__";
          window.__apiUrl = function (p) { return p && p.charAt(0) === '/' ? (window.__API_BASE__ || '') + p : p; };
          EOF
          sed -i "s#__API_BASE_PLACEHOLDER__#${base}#g" public/js/config.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
